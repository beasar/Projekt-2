<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navn</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header m. titel og søgeformular-->
    <header class="main-header">
        <h1>Velkommen til Navn</h1>
        <p>Vejret fortalt med lidt ekstra varme</p>

        <!--Søgeformular for byer-->
        <form id="search-form">
            <input id="city-input" placeholder="Indtast en by (fx. Aarhus)" />
            <button type="submit">Søg</button>
        </form>

        <p id="status"></p>
    </header>
    <!-- Bynavn -->
    <h1>Vejret i <span id="city">...</span>, <span id="day-range">...</span></h1>
    <!-- Vejrdata -->
    <section id="weather" class="weather-card" hidden>

        <div class="weather-icon">
            <p id="temp"></p>
            <p id="icon"></p>
            <p id="description"></p>
        </div>

        <ul class="weather-details">
            <li>💨 Vind: <span id="wind"></span></li>
            <li>💧 Luftfugtighed: <span id="humidity"></span></li>
            <li>🌧️ Regnrisiko: <span id="rain-risk"></span></li>
        </ul>

        <section class="forecast">
            <h2>Resten af dagen</h2>
            <ul id="forecast-list" class="forecast-list"></ul>
        </section>

        <!-- Tøjanbefaling -->
        <section id="clothing-advice" class="clothing-card">
            <h2>Dagens outfit</h2>

            <div class="bear-image">
                <img src="images/bamse_shorts-tshirt.png" alt="Bamse med shorts og t-shirt" id="bear-image">
            </div>

            <div class="advice-text">
                <p id="clothing-text">Husk solcremen i dag!</p>
            </div>
        </section>

    </section>
    <script type="module" src="js/weather.js"></script>
</body>

</html>
