<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<script src="js/weather.js" defer></script>

<body>
    <h1>Velkommen til Navn</h1>
    <p>Din personlige vejr- og tøjrådgiver</p>

    <h1>Vejret i <span id="city">...</span></h1>

    <form id="search-form">
        <input id="city-input" placeholder="Indtast en by (fx. Aarhus)" />
        <button type="submit">Søg</button>
    </form>

    <p id="status"></p>

    <!-- Vejrdata -->
    <section id="weather" class="weather-card" hidden>
        <h2>Vejret i dag</h2>
        <p id="icon"></p>
        <p id="temp"></p>
        <p id="description"></p>

        <ul>
            <li>Vind: <span id="wind"></span></li>
            <li>Luftfugtighed: <span id="humidity"></span></li>
            <li>Regnrisiko: <span id="rain-risk"></span></li>
        </ul>
    </section>

    <!-- Vejr og tøjanbefaling -->
<div class="dashboard-sections">

    <!-- Tøjanbefaling -->
    <section id="clothing-advice" class="clothing-card">
        <h2>Tøjanbefaling</h2>

        <div class="bear-image">
            <img src="images/bamse_shorts-tshirt.png"
                 alt="Bamse med shorts og t-shirt"
                 id="bear-image">
        </div>

        <div class="advice-text">
            <h3>Bamsens anbefaling</h3>
            <p id="clothing-text">Husk solcremen i dag!</p>
        </div>
    </section>

</div>

</section>

    <script src="weather.js"></script>
</body>

</html>
